services:
  postgres:
    image: postgres:16-alpine
    container_name: aptora-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: aptora
      POSTGRES_PASSWORD: aptora
      POSTGRES_DB: aptora
    volumes:
      - aptora_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aptora -d aptora"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aptora_pg_data:
